name: Build Cavern WASM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WASM Tools
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore Cavern/Cavern.csproj

      - name: Build project
        run: dotnet build Cavern/Cavern.csproj -c Release --no-restore

      - name: Publish Cavern for WASM
        run: dotnet publish Cavern/Cavern.csproj -c Release -o output/wasm --nologo

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cavern-wasm-binaries
          path: output/wasm/
