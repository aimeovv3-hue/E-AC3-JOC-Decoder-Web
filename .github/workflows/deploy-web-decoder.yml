name: Build & Deploy Cavern E-AC3-JOC 22.2 Web Decoder

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cavern Fork
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET 8 SDK & Install wasm-tools workload
        run: |
          DOTNET8_VER=$(dotnet --list-sdks | grep "^8\.0\." | tail -n 1 | awk '{print $1}')
          echo "Pinning .NET SDK version to: $DOTNET8_VER"
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch"}}\n' "$DOTNET8_VER" > global.json
          dotnet --version
          dotnet workload install wasm-tools

      - name: Patch Cavern Parallelizer & Channel Matrices for WASM
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Replace Parallelizer.cs with synchronous For AND ForUnchecked (instance + static)
          parallelizer_path = "Cavern/Utilities/Threading/Parallelizer.cs"
          if os.path.isfile(parallelizer_path):
              with open(parallelizer_path, "w", encoding="utf-8") as f:
                  f.write("""using System;
          using System.Runtime.CompilerServices;

          namespace Cavern.Utilities.Threading {
              public sealed class Parallelizer : IDisposable {
                  readonly Action<int> action;

                  public Parallelizer(Action<int> action) => this.action = action;

                  [MethodImpl(MethodImplOptions.AggressiveInlining)]
                  public void For(int start, int end) {
                      for (int i = start; i < end; i++)
                          action(i);
                  }

                  [MethodImpl(MethodImplOptions.AggressiveInlining)]
                  public void ForUnchecked(int start, int end) {
                      for (int i = start; i < end; i++)
                          action(i);
                  }

                  [MethodImpl(MethodImplOptions.AggressiveInlining)]
                  public static void For(int start, int end, Action<int> action) {
                      for (int i = start; i < end; i++)
                          action(i);
                  }

                  [MethodImpl(MethodImplOptions.AggressiveInlining)]
                  public static void ForUnchecked(int start, int end, Action<int> action) {
                      for (int i = start; i < end; i++)
                          action(i);
                  }

                  public void Dispose() { }
              }
          }
          """)
              print("[Patched] Parallelizer.cs with synchronous For and ForUnchecked")

          shim_code = """using System;
          using System.Collections.Generic;
          using System.Runtime.CompilerServices;
          using System.Threading;
          using System.Threading.Tasks;

          internal static class CavernWasmSync
          {
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static ParallelLoopResult For(int fromInclusive, int toExclusive, Action<int> body)
              {
                  for (int i = fromInclusive; i < toExclusive; i++) body(i);
                  return default;
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static ParallelLoopResult For(long fromInclusive, long toExclusive, Action<long> body)
              {
                  for (long i = fromInclusive; i < toExclusive; i++) body(i);
                  return default;
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static ParallelLoopResult For(int fromInclusive, int toExclusive, ParallelOptions options, Action<int> body)
              {
                  for (int i = fromInclusive; i < toExclusive; i++) body(i);
                  return default;
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static ParallelLoopResult ForEach<TSource>(IEnumerable<TSource> source, Action<TSource> body)
              {
                  foreach (TSource item in source) body(item);
                  return default;
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static ParallelLoopResult ForEach<TSource>(IEnumerable<TSource> source, ParallelOptions options, Action<TSource> body)
              {
                  foreach (TSource item in source) body(item);
                  return default;
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static void Invoke(params Action[] actions)
              {
                  if (actions == null) return;
                  for (int i = 0; i < actions.Length; i++) actions[i]?.Invoke();
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static Task Run(Action action)
              {
                  action();
                  return Task.CompletedTask;
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static Task Run(Action action, CancellationToken token)
              {
                  action();
                  return Task.CompletedTask;
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static Task<TResult> Run<TResult>(Func<TResult> function)
              {
                  return Task.FromResult(function());
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static Task<TResult> Run<TResult>(Func<TResult> function, CancellationToken token)
              {
                  return Task.FromResult(function());
              }
              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              public static void WaitAll(params Task[] tasks)
              {
                  if (tasks == null) return;
                  for (int i = 0; i < tasks.Length; i++)
                  {
                      if (tasks[i] != null && tasks[i].Status == TaskStatus.Created)
                          tasks[i].RunSynchronously();
                  }
              }
          }
          """

          for proj_dir in ["Cavern", "Cavern.Format"]:
              if os.path.isdir(proj_dir):
                  with open(os.path.join(proj_dir, "CavernWasmSync.cs"), "w", encoding="utf-8") as f:
                      f.write(shim_code)

              for root, _, files in os.walk(proj_dir):
                  for file in files:
                      if not file.endswith(".cs") or file in ("CavernWasmSync.cs", "Parallelizer.cs"):
                          continue
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8-sig") as f:
                          content = f.read()

                      orig = content
                      content = re.sub(r'\bParallel\.For\b', 'CavernWasmSync.For', content)
                      content = re.sub(r'\bParallel\.ForEach\b', 'CavernWasmSync.ForEach', content)
                      content = re.sub(r'\bParallel\.Invoke\b', 'CavernWasmSync.Invoke', content)
                      content = re.sub(r'\bTask\.Run\b', 'CavernWasmSync.Run', content)
                      content = re.sub(r'\bTask\.WaitAll\b', 'CavernWasmSync.WaitAll', content)

                      if "Task" in content and "Stopwatch" not in content:
                          content = re.sub(r'\.Start\(\)', '.RunSynchronously()', content)

                      if content != orig:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(content)

          # 2. Update Program.cs to use Cavern's native cubical channel matrices + SMPTE Ch 5/6 Side Surround order
          prog_path = "CavernWebDecoder/Program.cs"
          with open(prog_path, "w", encoding="utf-8") as f:
              f.write("""using System;
          using System.IO;
          using System.Runtime.CompilerServices;
          using System.Runtime.InteropServices.JavaScript;
          using System.Runtime.Versioning;
          using Cavern;
          using Cavern.Channels;
          using Cavern.Format;
          using Cavern.Format.Renderers;

          [assembly: SupportedOSPlatform("browser")]

          public partial class Program
          {
              private static MemoryStream? _inputStream;
              private static AudioReader? _reader;
              private static Renderer? _renderer;
              private static Listener? _listener;

              private static int _outputChannels = 24;
              private static int _sampleRate = 48000;
              private static int _pcmBitDepth = 24;
              private static int _updateRate = 256;
              private static long _totalSamplesPerChannel = 0;
              private static long _samplesRendered = 0;
              private static int _totalFrames = 0;
              private static string _lastLog = "";
              private static string _lastError = "";
              private static byte[]? _reusableBatchBuffer;

              public static void Main()
              {
                  Console.WriteLine("[Cavernize WASM AOT+SIMD] E-AC-3 JOC Decoder ready.");
              }

              [JSExport] public static string GetLastLog() => _lastLog;
              [JSExport] public static string GetLastError() => _lastError;
              [JSExport] public static int GetOutputChannels() => _outputChannels;
              [JSExport] public static int GetSampleRate() => _sampleRate;
              [JSExport] public static int GetTotalFrames() => _totalFrames;
              [JSExport] public static int GetFramesProcessed() => (int)(_samplesRendered / 1536);

              [JSExport]
              public static int InitSession(
                  byte[] inputBytes,
                  string fileName,
                  string targetLayout,
                  int pcmBitDepth,
                  int targetSampleRate,
                  int updateRateSamples,
                  int audioQualityIndex,
                  double gainDb,
                  bool lfeSeparation)
              {
                  CloseSession();
                  _lastError = "";
                  _lastLog = "";

                  try
                  {
                      byte[]? streamBytes = Mp4Ec3Extractor.ExtractIfMp4(inputBytes, fileName, false, (_, _) => { });
                      if (streamBytes != null && streamBytes.Length > 0 && !ReferenceEquals(streamBytes, inputBytes))
                      {
                          _inputStream = new MemoryStream(streamBytes, writable: false);
                      }
                      else
                      {
                          _inputStream = new MemoryStream(inputBytes, writable: false);
                      }

                      try
                      {
                          _reader = AudioReader.Open(_inputStream);
                          _reader.ReadHeader();
                          _renderer = _reader.GetRenderer();
                      }
                      catch
                      {
                          _inputStream?.Dispose();
                          _inputStream = new MemoryStream(inputBytes, writable: false);
                          _reader = AudioReader.Open(_inputStream);
                          _reader.ReadHeader();
                          _renderer = _reader.GetRenderer();
                      }

                      _sampleRate = targetSampleRate > 0 ? targetSampleRate : _reader.SampleRate;
                      if (_sampleRate <= 0) _sampleRate = 48000;

                      _updateRate = (updateRateSamples > 0 && updateRateSamples <= 256) ? updateRateSamples : 256;
                      _pcmBitDepth = pcmBitDepth;

                      bool binaural = ConfigureCavernizeLayout(targetLayout);
                      _outputChannels = Listener.Channels.Length;

                      float linearVolume = (float)Math.Pow(10.0, Math.Clamp(gainDb, -40.0, 20.0) / 20.0);

                      QualityModes quality = audioQualityIndex switch
                      {
                          0 => QualityModes.Low,
                          1 => QualityModes.Medium,
                          2 => QualityModes.High,
                          3 => QualityModes.Perfect,
                          _ => QualityModes.Perfect
                      };

                      _listener = new Listener
                      {
                          SampleRate = _sampleRate,
                          UpdateRate = _updateRate,
                          Volume = linearVolume,
                          AudioQuality = quality,
                          LFESeparation = lfeSeparation
                      };
                      Listener.HeadphoneVirtualizer = binaural;

                      foreach (Source source in _renderer.Objects)
                      {
                          _listener.AttachSource(source);
                      }

                      _totalSamplesPerChannel = _reader.Length;
                      if (_totalSamplesPerChannel > 0 && _sampleRate != _reader.SampleRate && _reader.SampleRate > 0)
                      {
                          _totalSamplesPerChannel = (long)((double)_reader.Length * _sampleRate / _reader.SampleRate);
                      }

                      if (_totalSamplesPerChannel <= 0 && _inputStream != null)
                      {
                          long estimatedFrames = Math.Max(1, _inputStream.Length / 1536);
                          _totalSamplesPerChannel = estimatedFrames * 1536;
                      }

                      _samplesRendered = 0;
                      _totalFrames = (int)Math.Max(1, (_totalSamplesPerChannel + 1535) / 1536);

                      _lastLog = $"[Cavernize] '{fileName}' | SR: {_reader.SampleRate} Hz | JOC Objects: {_renderer.Objects.Count} | Layout: {targetLayout} ({_outputChannels} ch) | UpdateRate: {_updateRate} | Frames: {_totalFrames}";
                      return _totalFrames;
                  }
                  catch (Exception ex)
                  {
                      _lastError = $"{ex}";
                      Console.Error.WriteLine($"[Cavernize Init Error] {ex}");
                      CloseSession();
                      return -1;
                  }
              }

              [JSExport]
              public static byte[] RenderNextBatch(int framesToRender)
              {
                  if (_listener == null || _reader == null || _inputStream == null)
                      return Array.Empty<byte>();

                  if (_samplesRendered >= _totalSamplesPerChannel)
                      return Array.Empty<byte>();

                  try
                  {
                      int bytesPerSample = _pcmBitDepth >> 3;
                      long targetSamples = Math.Min(_totalSamplesPerChannel - _samplesRendered, (long)framesToRender * 1536);
                      if (targetSamples <= 0)
                          return Array.Empty<byte>();

                      int blocks = (int)((targetSamples + _updateRate - 1) / _updateRate);
                      int requiredBytes = blocks * _updateRate * _outputChannels * bytesPerSample;

                      if (_reusableBatchBuffer == null || _reusableBatchBuffer.Length != requiredBytes)
                      {
                          _reusableBatchBuffer = new byte[requiredBytes];
                      }

                      int byteOffset = 0;

                      for (int b = 0; b < blocks; b++)
                      {
                          if (_samplesRendered >= _totalSamplesPerChannel)
                              break;

                          float[] renderedBlock = _listener.Render();
                          long remaining = _totalSamplesPerChannel - _samplesRendered;
                          int samplesInBlock = (int)Math.Min(_updateRate, remaining);
                          int floatCount = samplesInBlock * _outputChannels;

                          byteOffset += ConvertFloatToPcmFast(renderedBlock, floatCount, _pcmBitDepth, _reusableBatchBuffer, byteOffset);
                          _samplesRendered += samplesInBlock;
                      }

                      if (byteOffset == _reusableBatchBuffer.Length)
                          return _reusableBatchBuffer;

                      byte[] trimmed = new byte[byteOffset];
                      Buffer.BlockCopy(_reusableBatchBuffer, 0, trimmed, 0, byteOffset);
                      return trimmed;
                  }
                  catch (Exception ex)
                  {
                      _lastError = $"Render error at frame {GetFramesProcessed()}: {ex}";
                      Console.Error.WriteLine(_lastError);
                      return Array.Empty<byte>();
                  }
              }

              [JSExport]
              public static void CloseSession()
              {
                  try { _reader?.Dispose(); } catch { }
                  try { _inputStream?.Dispose(); } catch { }
                  _reader = null;
                  _renderer = null;
                  _listener = null;
                  _inputStream = null;
                  _reusableBatchBuffer = null;
              }

              [MethodImpl(MethodImplOptions.AggressiveInlining)]
              private static unsafe int ConvertFloatToPcmFast(float[] samples, int count, int bitDepth, byte[] dest, int offset)
              {
                  int startOffset = offset;
                  fixed (float* srcPtr = samples)
                  fixed (byte* dstBase = dest)
                  {
                      byte* dst = dstBase + offset;
                      switch (bitDepth)
                      {
                          case 24:
                              for (int i = 0; i < count; i++)
                              {
                                  float s = srcPtr[i];
                                  if (s > 1f) s = 1f;
                                  else if (s < -1f) s = -1f;
                                  int val = (int)(s * 8388607f);
                                  dst[0] = (byte)val;
                                  dst[1] = (byte)(val >> 8);
                                  dst[2] = (byte)(val >> 16);
                                  dst += 3;
                              }
                              return count * 3;

                          case 16:
                              short* dst16 = (short*)dst;
                              for (int i = 0; i < count; i++)
                              {
                                  float s = srcPtr[i];
                                  if (s > 1f) s = 1f;
                                  else if (s < -1f) s = -1f;
                                  dst16[i] = (short)(s * 32767f);
                              }
                              return count * 2;

                          case 32:
                              Buffer.MemoryCopy(srcPtr, dst, count * 4, count * 4);
                              return count * 4;

                          case 8:
                              for (int i = 0; i < count; i++)
                              {
                                  float s = srcPtr[i];
                                  if (s > 1f) s = 1f;
                                  else if (s < -1f) s = -1f;
                                  dst[i] = (byte)((s + 1f) * 127.5f);
                              }
                              return count;
                      }
                  }
                  return offset - startOffset;
              }

              /// <summary>
              /// Uses Cavern's native ChannelPrototype matrices so the 3D cubical panner has zero dead zones,
              /// and places Side Surrounds (SL/SR, where Atmos backing/hidden vocals reside) on Channels 5 & 6.
              /// </summary>
              private static bool ConfigureCavernizeLayout(string layoutKey)
              {
                  switch (layoutKey)
                  {
                      case "virtualizer":
                          Listener.ReplaceChannels(2);
                          return true;
                      case "2.0":
                          Listener.ReplaceChannels(2);
                          return false;
                      case "4.0":
                          Listener.ReplaceChannels(4);
                          return false;
                      case "5.1":
                          Listener.ReplaceChannels(6);
                          return false;
                      case "7.1":
                          SetCavernMatrixWithSmpteSurroundOrder(8);
                          return false;
                      case "5.1.2":
                          Listener.ReplaceChannels(8);
                          return false;
                      case "5.1.4":
                          Listener.ReplaceChannels(10);
                          return false;
                      case "7.1.2":
                          SetCavernMatrixWithSmpteSurroundOrder(10);
                          return false;
                      case "7.1.4":
                          SetCavernMatrixWithSmpteSurroundOrder(12);
                          return false;
                      case "7.1.6":
                          SetCavernMatrixWithSmpteSurroundOrder(14);
                          return false;
                      case "9.1.6":
                          SetCavernMatrixWithSmpteSurroundOrder(16);
                          return false;
                      case "22.2":
                      default:
                          Listener.ReplaceChannels(24);
                          return false;
                  }
              }

              private static void SetCavernMatrixWithSmpteSurroundOrder(int count)
              {
                  Listener.ReplaceChannels(count);
                  Channel[] ch = Listener.Channels;
                  if (ch.Length >= 8)
                  {
                      // Swap Rear (index 4, 5) with Side (index 6, 7) so Ch 5 & 6 are Side Surrounds (Ls/Rs)
                      (ch[4], ch[6]) = (ch[6], ch[4]);
                      (ch[5], ch[7]) = (ch[7], ch[5]);
                  }
              }
          }
          """)

          # 3. Configure CavernWebDecoder.csproj for LLVM AOT + WASM 128-bit SIMD
          csproj_path = "CavernWebDecoder/CavernWebDecoder.csproj"
          if os.path.isfile(csproj_path):
              with open(csproj_path, "w", encoding="utf-8") as f:
                  f.write("""<Project Sdk="Microsoft.NET.Sdk.WebAssembly">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <RuntimeIdentifier>browser-wasm</RuntimeIdentifier>
              <OutputType>Exe</OutputType>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <Nullable>enable</Nullable>
              <Optimize>true</Optimize>
              <WasmMainJSPath>wasm-main.js</WasmMainJSPath>
              <RunAOTCompilation>true</RunAOTCompilation>
              <WasmEnableSIMD>true</WasmEnableSIMD>
              <InvariantGlobalization>true</InvariantGlobalization>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\\Cavern\\Cavern.csproj" />
              <ProjectReference Include="..\\Cavern.Format\\Cavern.Format.csproj" />
            </ItemGroup>
          </Project>""")

          # 4. Remove setTimeout(0) throttle in worker.js and process 32 frames per batch
          worker_path = "CavernWebDecoder/wwwroot/worker.js"
          if os.path.isfile(worker_path):
              with open(worker_path, "r", encoding="utf-8") as f:
                  w = f.read()
              w = w.replace("await new Promise((r) => setTimeout(r, 0));", "")
              w = w.replace("const batchSizeFrames = 12;", "const batchSizeFrames = 32;")
              with open(worker_path, "w", encoding="utf-8") as f:
                  f.write(w)
          EOF

      - name: Restore workloads & Publish CavernWebDecoder with LLVM AOT & SIMD128
        run: |
          dotnet workload restore CavernWebDecoder/CavernWebDecoder.csproj
          dotnet publish CavernWebDecoder/CavernWebDecoder.csproj -c Release -o release_dist

      - name: Assemble GitHub Pages directory
        run: |
          mkdir -p pages_out
          BOOT_JSON=$(find release_dist -name "blazor.boot.json" | head -n 1)
          if [ -z "$BOOT_JSON" ]; then
            BOOT_JSON=$(find release_dist -name "dotnet.js" | head -n 1)
          fi
          FRAMEWORK_DIR=$(dirname "$BOOT_JSON")
          echo "Copying published _framework from: $FRAMEWORK_DIR"
          cp -r "$FRAMEWORK_DIR" pages_out/_framework
          cp -r CavernWebDecoder/wwwroot/* pages_out/
          touch pages_out/.nojekyll
          ls -lh pages_out/_framework

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
